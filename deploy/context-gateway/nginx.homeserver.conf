# Cloudflare Tunnel terminates TLS. The host proxies to the internal bridge;
# containers publish no ports and have no network for outbound routing.
server {
    listen 80;
    server_name share.winterholic.net;
    client_max_body_size 64k;
    access_log off;
    location / {
        proxy_pass http://172.31.0.3:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 65s;
    }
}

# Publisher authentication is enforced by the separate control application.
# The public application has no route, credentials or write mount for control.
server {
    listen 80;
    server_name share-control.winterholic.net;
    access_log off;
    client_max_body_size 24m;
    location ^~ /control/v1/ {
        proxy_pass http://172.31.0.2:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }
    location ^~ /control/v2/ {
        proxy_pass http://172.31.0.2:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }
    location / { return 404; }
}
