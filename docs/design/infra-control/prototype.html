<style>

.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.pt-bar { display: flex; align-items: center; gap: var(--tk-space-2); padding: var(--tk-space-2) var(--tk-space-3); background: var(--tk-color-surface-inverse); color: var(--tk-color-text-primary); border-bottom: var(--tk-border-width-hairline) solid var(--tk-color-border-default); }

.ic-ribbon { display: flex; align-items: center; gap: var(--tk-space-2); padding: var(--tk-space-1-5) var(--tk-space-4); background: var(--tk-color-status-neutral-bg); color: var(--tk-color-status-neutral-text); border-bottom: var(--tk-border-width-hairline) solid var(--tk-color-status-neutral-border); font: var(--tk-font-weight-medium) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); }

@media (min-width: 1024px) { .ic-main { padding-inline: var(--tk-space-6); } }
.ic-main > * { margin: 0; }
.ic-banner { border: var(--tk-border-width-hairline) solid var(--tk-_border); border-radius: var(--tk-radius-lg); }
.ic-banner > .tk-button { --tk-_h: var(--tk-size-touch-target-min); --tk-_px: var(--tk-space-4); font-size: var(--tk-font-size-sm); }

.ic-eyebrow { color: var(--tk-color-text-tertiary); font: var(--tk-font-weight-medium) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); }
.ic-h2 { color: var(--tk-color-text-secondary); font: var(--tk-font-weight-semibold) var(--tk-font-size-sm) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); }

.ic-section__head { display: flex; align-items: center; justify-content: space-between; gap: var(--tk-space-2); }
.ic-section > * { margin: 0; }

/* 전체 상태 */
.ic-hero { --_c: var(--tk-color-status-neutral-solid); --_bg: var(--tk-color-status-neutral-bg); --_bd: var(--tk-color-status-neutral-border); --_fg: var(--tk-color-status-neutral-text);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: var(--tk-space-3) var(--tk-space-4); padding: var(--tk-space-4);
  border: var(--tk-border-width-hairline) solid var(--_bd); border-radius: var(--tk-radius-xl); background: var(--_bg); }
.ic-hero[data-verdict="ok"] { --_c: var(--tk-color-status-success-solid); --_bg: var(--tk-color-status-success-bg); --_bd: var(--tk-color-status-success-border); --_fg: var(--tk-color-status-success-text); }
.ic-hero[data-verdict="warn"] { --_c: var(--tk-color-status-warning-solid); --_bg: var(--tk-color-status-warning-bg); --_bd: var(--tk-color-status-warning-border); --_fg: var(--tk-color-status-warning-text); }
.ic-hero[data-verdict="bad"] { --_c: var(--tk-color-status-danger-solid); --_bg: var(--tk-color-status-danger-bg); --_bd: var(--tk-color-status-danger-border); --_fg: var(--tk-color-status-danger-text); }
.ic-hero__mark { display: grid; place-items: center; width: var(--tk-size-control-lg); height: var(--tk-size-control-lg); border-radius: var(--tk-radius-full); background: var(--_c); color: var(--tk-color-surface-default); }
.ic-hero[data-verdict="ok"] .ic-hero__mark { color: var(--tk-color-status-success-on-solid); }

.ic-hero[data-verdict="unknown"] .ic-hero__mark, .ic-hero[data-verdict="partial"] .ic-hero__mark { color: var(--tk-color-status-neutral-on-solid); }
.ic-reason { display: inline-flex; align-items: center; padding: 0 var(--tk-space-1-5); border: var(--tk-border-width-hairline) solid var(--tk-color-border-strong); border-radius: var(--tk-radius-sm); color: var(--tk-color-text-secondary); font: var(--tk-font-weight-medium) var(--tk-font-size-xs) / var(--tk-font-line-height-relaxed) var(--tk-font-family-sans); }
.ic-hero__mark .tk-icon { --tk-_icon: var(--tk-size-icon-lg); }
.ic-hero__body { display: flex; flex-direction: column; gap: var(--tk-space-1); min-width: 0; }
.ic-hero__body > * { margin: 0; }
.ic-hero__verdict { color: var(--_fg); font: var(--tk-font-weight-bold) var(--tk-font-size-2xl) / var(--tk-font-line-height-snug) var(--tk-font-family-sans); letter-spacing: var(--tk-font-letter-spacing-tight); }
.ic-hero__line { color: var(--tk-color-text-primary); font: var(--tk-font-weight-medium) var(--tk-font-size-md) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); }
.ic-hero__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--tk-space-1) var(--tk-space-3); color: var(--tk-color-text-secondary); font: var(--tk-font-weight-regular) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); font-variant-numeric: tabular-nums; }
.ic-hero__meta > span { display: inline-flex; align-items: center; gap: var(--tk-space-1); }
.ic-hero__act { align-self: start; }
.ic-hero__meta time { white-space: nowrap; }
@media (max-width: 480px) { .ic-hero { grid-template-columns: auto minmax(0, 1fr); } .ic-hero__act { grid-column: 1 / -1; } .ic-hero__act .tk-button { width: 100%; } }

/* 목록 */
.ic-list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); border-radius: var(--tk-radius-lg); background: var(--tk-color-surface-default); overflow: hidden; }
.ic-list > li + li { border-top: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); }
.ic-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--tk-space-1) var(--tk-space-2); width: 100%; min-height: var(--tk-size-touch-target-min); padding: var(--tk-space-3) var(--tk-space-4); cursor: pointer; }
.ic-row:hover { background: var(--tk-color-interactive-hover-overlay); }
.ic-row:focus-visible { outline: var(--tk-focus-ring-width) solid var(--tk-color-interactive-focus-ring); outline-offset: calc(-1 * var(--tk-focus-ring-width)); }
.ic-row[aria-current="true"] { background: var(--tk-color-interactive-selected-bg); }
.ic-row__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--tk-space-1) var(--tk-space-2); min-width: 0; }
.ic-row__name { color: var(--tk-color-text-primary); font: var(--tk-font-weight-semibold) var(--tk-font-size-md) / var(--tk-font-line-height-snug) var(--tk-font-family-sans); }
.ic-row__host, .ic-row__dur { color: var(--tk-color-text-tertiary); font: var(--tk-font-weight-regular) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); font-variant-numeric: tabular-nums; }
.ic-row__dur { color: var(--tk-color-text-secondary); font-weight: var(--tk-font-weight-medium); }
.ic-row__chev { grid-row: 1 / span 3; grid-column: 2; color: var(--tk-color-text-tertiary); }
.ic-row__line { grid-column: 1; color: var(--tk-color-text-secondary); font: var(--tk-font-weight-regular) var(--tk-font-size-sm) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); }
.ic-row__line b { color: var(--tk-color-text-tertiary); font-weight: var(--tk-font-weight-medium); margin-right: var(--tk-space-1-5); }

/* 칸 */
.ic-cols { display: grid; gap: var(--tk-space-4); min-width: 0; }
@media (min-width: 1024px) { .ic-cols[data-split="1"] { grid-template-columns: minmax(0, 1fr) minmax(24rem, 30rem); align-items: start; } }
.ic-col { display: flex; flex-direction: column; gap: var(--tk-space-4); min-width: 0; }

.ic-card { display: flex; flex-direction: column; gap: var(--tk-space-1); min-width: 0; padding: var(--tk-space-3) var(--tk-space-4); border: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); border-radius: var(--tk-radius-lg); background: var(--tk-color-surface-default); }

.ic-card__top { display: flex; align-items: center; justify-content: space-between; gap: var(--tk-space-2); }

.ic-card__sub, .ic-card__metric { color: var(--tk-color-text-tertiary); font: var(--tk-font-weight-regular) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); font-variant-numeric: tabular-nums; }

.ic-src { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); border-radius: var(--tk-radius-lg); background: var(--tk-color-surface-default); }
.ic-src > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--tk-space-0-5) var(--tk-space-2); align-items: center; padding: var(--tk-space-2) var(--tk-space-4); min-height: var(--tk-size-touch-target-min); }
.ic-src > li + li { border-top: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); }

.ic-src__note { grid-column: 1 / -1; color: var(--tk-color-text-tertiary); font: var(--tk-font-weight-regular) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); font-variant-numeric: tabular-nums; }
.ic-details { border: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); border-radius: var(--tk-radius-lg); background: var(--tk-color-surface-default); }
.ic-details > summary { display: flex; align-items: center; gap: var(--tk-space-2); min-height: var(--tk-size-touch-target-min); padding: var(--tk-space-2) var(--tk-space-4); cursor: pointer; color: var(--tk-color-text-secondary); font: var(--tk-font-weight-medium) var(--tk-font-size-sm) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); border-radius: var(--tk-radius-lg); }
.ic-details > summary:focus-visible { outline: var(--tk-focus-ring-width) solid var(--tk-color-interactive-focus-ring); outline-offset: calc(-1 * var(--tk-focus-ring-width)); }
.ic-details[open] > summary { border-bottom: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); border-radius: var(--tk-radius-lg) var(--tk-radius-lg) 0 0; }

.ic-facts dt { color: var(--tk-color-text-tertiary); font: var(--tk-font-weight-medium) var(--tk-font-size-xs) / var(--tk-font-line-height-relaxed) var(--tk-font-family-sans); }
.ic-facts dd { margin: 0; color: var(--tk-color-text-primary); font: var(--tk-font-weight-regular) var(--tk-font-size-sm) / var(--tk-font-line-height-relaxed) var(--tk-font-family-sans); }
.ic-ev { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); border-radius: var(--tk-radius-lg); }
.ic-ev > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--tk-space-0-5) var(--tk-space-3); padding: var(--tk-space-2) var(--tk-space-3); }
.ic-ev > li + li { border-top: var(--tk-border-width-hairline) solid var(--tk-color-border-subtle); }

.ic-ev__v { color: var(--tk-color-text-primary); font: var(--tk-font-weight-medium) var(--tk-font-size-sm) / var(--tk-font-line-height-normal) var(--tk-font-family-mono); text-align: right; font-variant-numeric: tabular-nums; }
.ic-ev__s { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--tk-space-1-5); color: var(--tk-color-text-tertiary); font: var(--tk-font-weight-regular) var(--tk-font-size-xs) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); font-variant-numeric: tabular-nums; }
.ic-tl { display: flex; flex-direction: column; gap: var(--tk-space-2); margin: 0; padding: 0; list-style: none; }
.ic-tl > li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: var(--tk-space-2); color: var(--tk-color-text-primary); font: var(--tk-font-weight-regular) var(--tk-font-size-sm) / var(--tk-font-line-height-normal) var(--tk-font-family-sans); }
.ic-tl time { color: var(--tk-color-text-tertiary); font-family: var(--tk-font-family-mono); font-size: var(--tk-font-size-xs); font-variant-numeric: tabular-nums; padding-top: var(--tk-space-px); }
.ic-ext { display: flex; flex-wrap: wrap; gap: var(--tk-space-2); }
.ic-ext .tk-button { min-height: var(--tk-size-touch-target-min); }

/* 빈·권한·로딩 */
.ic-state { max-width: 32rem; margin-inline: auto; }

.tk-badge .tk-icon { --tk-_icon: var(--tk-size-icon-xs); }
.tk-badge--neutral { --tk-_bg: var(--tk-color-status-neutral-bg); --tk-_fg: var(--tk-color-status-neutral-text); --tk-_border: var(--tk-color-status-neutral-border); }

    </dl>
    <section class="ic-section" aria-labelledby="d-ev"><h3 class="ic-h2" id="d-ev">확인한 값</h3><ul class="ic-ev">${ev}</ul></section>
    ${it.log.length ? `<section class="ic-section" aria-labelledby="d-log"><h3 class="ic-h2" id="d-log">판정 기록 <span class="ic-assume">수집 판정만 · 추정 사건 없음</span></h3><ol class="ic-tl">${log}</ol></section>` : ""}
    ${it.ext.length ? `<section class="ic-section" aria-labelledby="d-ext"><h3 class="ic-h2" id="d-ext">더 자세히 보려면 <span class="ic-assume">선택 · 시안은 이동 안 함</span></h3>
      <div class="ic-ext">${it.ext.map(k => `<a class="tk-button tk-button--secondary" href="#" data-ext="${k}" target="_blank" rel="noopener noreferrer">${EXT[k]}${icon("i-ext", "tk-icon--sm")}<span class="sr-only"> (새 창, 시안에서는 이동하지 않아요)</span></a>`).join("")}</div>
    </section>` : ""}
  </section>`;
}

function hostCard(h) {
  return `<li><span class="ic-src__name">${h.name} <span class="ic-card__sub">· ${h.sub}</span></span>${badge(h.sev)}<span class="ic-src__note">${h.metric} · ${h.last ? "마지막 값" : "수신"} ${h.seen}</span></li>`;
}
// 수집원 행의 초록은 '응답했다'이지 '서비스가 정상'이 아니다. 그래서 글자도 정상이 아니라 응답으로 쓴다.
const srcBadge = (sev) => sev === "ok" ? `<span class="tk-badge tk-badge--success">${icon("i-ok")}응답</span>` : badge(sev);
const srcRow = (s) => `<li><span class="ic-src__name">${s.name}</span>${srcBadge(s.sev)}<span class="ic-src__note">${s.note}</span></li>`;
const reasonChip = (a) => a.reason ? `<span class="ic-reason">사유 · ${a.reason}</span>` : "";

function renderState(m) {
  const main = $("#main");
  const hdrMeta = $("#hdr-meta"), act = $("#hdr-actions");
  act.innerHTML = "";
  hdrMeta.textContent = "Mac Studio · ubuntu-01 (후보)";
  main.removeAttribute("aria-busy");
  if (m.loading) {
    hdrMeta.textContent = "불러오는 중"; // 권한 확인 전이라 호스트 이름을 미리 보여 주지 않는다
    main.setAttribute("aria-busy", "true");
    main.innerHTML = `<h2 class="sr-only">관제 상태를 불러오는 중</h2>
      <div class="ic-hero" data-verdict="unknown" aria-hidden="true" style="background:var(--tk-color-surface-default);border-color:var(--tk-color-border-subtle)"><span class="tk-skeleton ic-hero__mark" style="border-radius:var(--tk-radius-full)"></span><div class="ic-hero__body"><span class="tk-skeleton tk-skeleton--text" style="width:30%;height:1.6rem"></span><span class="tk-skeleton tk-skeleton--text" style="width:70%"></span><span class="tk-skeleton tk-skeleton--text" style="width:55%"></span></div></div>
      <div class="ic-section" aria-hidden="true"><span class="tk-skeleton tk-skeleton--text" style="width:40%"></span><ul class="ic-skel"><li class="tk-skeleton tk-skeleton--block"></li><li class="tk-skeleton tk-skeleton--block"></li></ul></div>
      <div class="ic-section" aria-hidden="true"><span class="tk-skeleton tk-skeleton--text" style="width:20%"></span><ul class="ic-skel"><li class="tk-skeleton tk-skeleton--block"></li><li class="tk-skeleton tk-skeleton--block"></li><li class="tk-skeleton tk-skeleton--block"></li></ul></div>`;
    return;
  }
  if (m.denied) {
    hdrMeta.textContent = ""; // 권한이 없으면 호스트 이름도 보여 주지 않는다
    main.innerHTML = `<div class="tk-empty tk-empty--boxed ic-state" role="alert">${icon("i-lock", "tk-icon--xl")}
      <h2 class="tk-empty__title">관제를 볼 권한이 없어요</h2>
      <p>이 계정에는 관제 조회 권한이 없어요. 상태 값은 불러오지 않았어요. 이전에 본 값도 이 화면에 남기지 않아요.</p>
      <div class="tk-button-group"><button class="tk-button tk-button--secondary" type="button">다른 계정으로 로그인</button><button class="tk-button tk-button--ghost" type="button">다시 시도</button></div></div>`;
    return;
  }
  if (m.empty) {
    hdrMeta.textContent = "관측 대상 없음";
    main.innerHTML = `<div class="tk-empty tk-empty--boxed ic-state">${icon("i-inbox", "tk-icon--xl")}
      <h2 class="tk-empty__title">아직 연결된 관측 대상이 없어요</h2>
      <p>수집원(Mac snapshot, Prometheus, Loki 등)이 연결되면 전체 상태가 여기에 나타나요. 지금은 아무것도 판정하지 않았고, 정상이라는 뜻도 아니에요.</p>
      <p class="ic-card__sub" id="empty-why">연결 방법은 I2.2에서 정해진 뒤 여기에 안내해요. 시안에는 연결 기능이 없어요.</p></div>`;
    return;
  }

  act.innerHTML = `<button class="tk-icon-button tk-icon-button--secondary" id="btn-refresh" type="button" aria-label="지금 다시 확인">${icon("i-refresh")}</button>`;
  const p = params();
  const sel = m.attention.find(a => a.id === p.d) || null;
  const isWide = wide();
  const cur = sel || (isWide ? m.attention[0] : null);
  const detailOnly = !isWide && sel;

  const banner = m.banner ? `<div class="tk-banner tk-banner--${m.banner.tone} ic-banner" role="${m.banner.tone === "danger" ? "alert" : "status"}">${icon(m.banner.icon || (m.banner.tone === "danger" ? "i-bad" : "i-warn"))}<span class="tk-banner__text">${m.banner.text}</span>${m.banner.action ? `<button class="tk-button tk-button--secondary tk-button--sm" type="button" id="btn-retry">${m.banner.action}</button>` : ""}</div>` : "";

  const hero = `<section class="ic-hero" data-verdict="${m.verdict}" aria-labelledby="verdict">
    <span class="ic-hero__mark">${icon(ICON[m.verdict])}</span>
    <div class="ic-hero__body">
      <p class="ic-eyebrow">전체 상태${m.last ? " · 마지막 값 기준" : ""}</p>
      <h2 class="ic-hero__verdict" id="verdict">${WORD[m.verdict]}</h2>
      <p class="ic-hero__line">${m.line}</p>
      ${m.prev ? `<p class="ic-hero__meta"><span>${m.prev.text}</span></p>` : ""}
      <p class="ic-hero__meta"><span>${icon("i-clock", "tk-icon--xs")}<time>${m.asOf}</time> ${m.sample ? "KST 관측" : m.last ? "마지막 성공" : "기준"} · ${m.age}</span></p>
      ${m.meta.length ? `<p class="ic-hero__meta">${m.meta.map(x => `<span>${x}</span>`).join("")}</p>` : ""}
    </div></section>`;

  let attn = "";
  if (m.attention.length) {
    attn = `<section class="ic-section" aria-labelledby="h-attn"><div class="ic-section__head"><h2 class="ic-h2" id="h-attn">${m.last ? "마지막으로 확인된 항목" : m.attention.every(a => a.sev === "unknown") ? "확인하지 못한 항목 (장애 아님)" : "조치가 필요한 항목"}</h2><span class="tk-badge tk-badge--count tk-badge--neutral" aria-label="${m.attention.length}건">${m.attention.length}</span></div>
      <ul class="ic-list">${m.attention.map(a => `<li><button class="ic-row" type="button" data-id="${a.id}" aria-controls="detail" ${cur && cur.id === a.id && isWide ? 'aria-current="true"' : ""}>
        <span class="ic-row__head">${badge(a.sev)}${reasonChip(a)}<span class="ic-row__name">${a.name}</span><span class="ic-row__host">${a.host}</span><span class="ic-row__dur">${a.dur}</span>${a.tag ? `<span class="ic-assume">${a.tag}</span>` : ""}</span>
        <span class="ic-row__line"><b>영향</b>${a.impact}</span><span class="ic-row__line"><b>근거</b>${a.basis}</span>
        <span class="ic-row__chev">${icon("i-right")}</span></button></li>`).join("")}</ul></section>`;
  } else {
    attn = `<section class="ic-section" aria-labelledby="h-attn"><h2 class="ic-h2" id="h-attn">조치가 필요한 항목</h2><p class="ic-card__sub" style="font-size:var(--tk-font-size-sm)">${m.last ? "마지막 값에는 문제·주의 항목이 없었어요. 지금 상태는 확인되지 않았어요." : "없어요. 관측한 서비스와 호스트가 모두 정상 범위예요."}</p></section>`;
  }
  const hosts = `<section class="ic-section" aria-labelledby="h-hosts"><h2 class="ic-h2" id="h-hosts">호스트</h2><ul class="ic-src" ${m.last ? "data-last" : ""}>${m.hosts.map(hostCard).join("")}</ul></section>`;
  // 정상일 때는 수집원도 접어서 간결하게 둔다. 문제·미확인이 있으면 어디가 비었는지 바로 보여야 하므로 펼쳐 둔다.
  const srcs = m.verdict === "ok"
    ? `<details class="ic-details"><summary>${icon("i-right", "tk-icon--sm ic-chev")}수집원 ${m.sources.length}개 모두 응답 · 마지막 수신 ${m.asOf}</summary><ul class="ic-src">${m.sources.map(srcRow).join("")}</ul></details>`
    : `<section class="ic-section" aria-labelledby="h-src"><h2 class="ic-h2" id="h-src">수집원 응답 <span class="ic-assume">수집 상태 · 서비스 정상 아님</span></h2><ul class="ic-src" ${m.last ? "data-last" : ""}>${m.sources.map(srcRow).join("")}</ul></section>`;
  const healthy = m.healthy.length ? `<details class="ic-details"><summary>${icon("i-right", "tk-icon--sm ic-chev")}정상 서비스 ${m.healthy.length}개 보기</summary><ul class="ic-src">${m.healthy.map(s => `<li><span class="ic-src__name">${s.name}</span>${badge("ok")}<span class="ic-src__note">${s.note}</span></li>`).join("")}</ul></details>` : "";

  if (detailOnly) {
    main.innerHTML = detailHtml(sel, { back: true });
  } else if (isWide && m.attention.length) {
    main.innerHTML = `${banner}${hero}<div class="ic-cols" data-split="1"><div class="ic-col">${attn}${hosts}${srcs}${healthy}</div><div class="ic-col">${detailHtml(cur, { back: false })}</div></div>`;
  } else {
    main.innerHTML = `${banner}${hero}<div class="ic-cols"><div class="ic-col">${attn}${hosts}${srcs}${healthy}</div></div>`;
  }
}

let lastRow = null;
function render() {
  const p = params();
  const key = SCEN[p.s] ? p.s : "normal";
  document.documentElement.dataset.theme = p.t === "dark" ? "dark" : "light";
  document.body.dataset.chrome = p.chrome === "0" ? "0" : "1";
  const m = SCEN[key];
  // 시안 도구
  const st = $("#pt-states");
  st.innerHTML = ORDER.map(k => `<button type="button" class="tk-chip" data-s="${k}" aria-pressed="${k === key}">${SCEN[k].label}</button>`).join("");
  $("#pt-theme").innerHTML = icon(p.t === "dark" ? "i-sun" : "i-moon");
  renderState(m);
  $("#live").textContent = m.announce;
  const hasDetailOnly = !wide() && p.d && m.attention && m.attention.some(a => a.id === p.d);
  if (hasDetailOnly) $("#d-title")?.focus();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.s) setParams({ s: t.dataset.s, d: null });
  else if (t.id === "pt-theme") setParams({ t: params().t === "dark" ? "light" : "dark" });
  else if (t.classList.contains("ic-row")) { lastRow = t.dataset.id; setParams({ d: t.dataset.id }); }
  else if (t.id === "btn-back") { setParams({ d: null }); document.querySelector(`.ic-row[data-id="${lastRow}"]`)?.focus(); }
  else if (t.id === "btn-refresh" || t.id === "btn-retry") {
    t.setAttribute("aria-busy", "true"); $("#live").textContent = "다시 확인하는 중";
    setTimeout(() => { t.removeAttribute("aria-busy"); $("#live").textContent = params().s === "failed" || params().s === "stale" ? "다시 확인했지만 아직 연결되지 않았어요" : "방금 갱신했어요"; }, 700);
  } else if (t.dataset.ext) e.preventDefault();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !wide() && params().d) { setParams({ d: null }); document.querySelector(`.ic-row[data-id="${lastRow}"]`)?.focus(); } });
matchMedia("(min-width: 1024px)").addEventListener("change", render);
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
