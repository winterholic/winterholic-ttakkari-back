[project]
name = "ttakkari"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "fastembed>=0.9.0",
    "holidays>=0.106",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pexpect>=4.9,<5",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "psutil>=7.2.2",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyte>=0.8,<0.9",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ttakkari = "ttakkari.cli:main"

[project.optional-dependencies]
# Optional worker only. av 19 removed metadata_errors, still used by faster-whisper 1.2.1.
stt = ["faster-whisper==1.2.1", "av>=15,<16"]
# Independent opt-in workers; no model downloads during transcription.
stt-diarization = ["pyannote.audio==4.0.3"]
stt-separation = ["speechbrain==1.0.3", "torch==2.8.0", "torchaudio==2.8.0"]
stt-speakers = ["speechbrain==1.0.3", "torch==2.8.0", "torchaudio==2.8.0", "scipy>=1.14"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "benchmark_tests", "unit_tests"]
